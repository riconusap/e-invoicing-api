version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-invoicing-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: e-invoicing-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  composer:
    image: composer/composer:latest-bin
    container_name: e-invoicing-composer
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - app
    profiles:
      - donotstart
    networks:
      - app-network

  artisan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-invoicing-artisan
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    profiles:
      - donotstart
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: e-invoicing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
